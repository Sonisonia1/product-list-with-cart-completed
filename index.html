<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A responsive dessert product list with a functional shopping cart.">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="./style.css">
  <title>Product list with cart</title>
</head>
<body>
  <main class="page-shell">
    <section class="products-section" aria-labelledby="page-title">
      <h1 id="page-title">Desserts</h1>
      <div id="product-grid" class="product-grid" aria-live="polite"></div>
    </section>

    <aside class="cart-card" aria-labelledby="cart-title">
      <h2 id="cart-title">Your Cart <span id="cart-count" aria-label="0 items">(0)</span></h2>
      <div id="cart-content"></div>
    </aside>
  </main>

  <div id="modal-root"></div>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank" rel="noreferrer">Frontend Mentor</a>.
    Coded by <a href="#">Sonia</a>.
  </footer>

  <script src="./script.js"></script>
</body>
</html>
